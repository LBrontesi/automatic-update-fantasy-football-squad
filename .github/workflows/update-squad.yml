name: Update fantasy squad

permissions:
  contents: read

on:
  schedule:
    # Try every three hours. The guard permits runs only before today's
    # first game, which gives multiple chances without changing a live day.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read the roster and print the recommendation without changing the lineup"
        required: false
        default: false
        type: boolean

jobs:
  schedule-guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check matchday guard
        id: guard
        run: |
          if python schedule_guard.py --timezone Europe/Rome; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    if: needs.schedule-guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    needs: schedule-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  update-squad:
    runs-on: ubuntu-latest
    needs: [schedule-guard, test]
    if: needs.schedule-guard.outputs.should_run == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Update squad
        run: python auto_clicker_fanta.py
        env:
          FANTACALCIO_EMAIL: ${{ secrets.FANTACALCIO_EMAIL }}
          FANTACALCIO_PASSWORD: ${{ secrets.FANTACALCIO_PASSWORD }}
          LEAGUE_URL: ${{ secrets.LEAGUE_URL }}
          HEADLESS: "true"
          REPLACE_EXISTING_LINEUP: "true"
          DRY_RUN: ${{ inputs.dry_run || false }}

      - name: Upload browser debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squad-debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
