name: Update fantasy squad

on:
  schedule:
    # Daily at 06:00 UTC (08:00 in Italy during summer time). Matchday
    # deadlines vary, so a daily run guarantees a pick+confirm within 24h
    # of any deadline; confirming an already-saved lineup is idempotent.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  update-squad:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update squad
        run: python auto_clicker_fanta.py
        env:
          FANTACALCIO_EMAIL: ${{ secrets.FANTACALCIO_EMAIL }}
          FANTACALCIO_PASSWORD: ${{ secrets.FANTACALCIO_PASSWORD }}
          LEAGUE_URL: ${{ secrets.LEAGUE_URL }}
          HEADLESS: "true"
