name: Update fantasy squad

permissions:
  contents: read

concurrency:
  group: fantasy-squad
  cancel-in-progress: false

on:
  schedule:
    # Try every three hours, away from the busy top of the hour.
    # The guard permits live runs only before today's first game.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read the roster and print the recommendation without changing the lineup"
        required: false
        default: false
        type: boolean

jobs:
  schedule-guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check matchday guard
        id: guard
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python schedule_guard.py --timezone Europe/Rome; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Squad update skipped by the fixture guard. No lineup was changed." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
        env:
          FANTA_BROWSER_TESTS: "true"

  update-squad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [schedule-guard, test]
    if: needs.schedule-guard.outputs.should_run == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Update squad
        run: python auto_clicker_fanta.py
        env:
          FANTACALCIO_EMAIL: ${{ secrets.FANTACALCIO_EMAIL }}
          FANTACALCIO_PASSWORD: ${{ secrets.FANTACALCIO_PASSWORD }}
          LEAGUE_URL: ${{ secrets.LEAGUE_URL }}
          HEADLESS: "true"
          REPLACE_EXISTING_LINEUP: "true"
          DRY_RUN: ${{ inputs.dry_run || false }}
          FORMATION: ${{ vars.FORMATION || 'auto' }}

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squad-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squad-debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
