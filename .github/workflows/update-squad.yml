name: Update fantasy squad

permissions:
  contents: read

concurrency:
  group: fantasy-squad
  cancel-in-progress: false

on:
  schedule:
    # Try every three hours, away from the busy top of the hour.
    # The guard permits live runs only before today's first game.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Read the roster and print the recommendation without changing the lineup"
        required: false
        default: false
        type: boolean
      check_feedback_source:
        description: "Validate whole-roster historical results without saving a lineup or training"
        required: false
        default: false
        type: boolean

jobs:
  schedule-guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check matchday guard
        id: guard
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ inputs.check_feedback_source }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python schedule_guard.py --timezone Europe/Rome; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Squad update skipped by the fixture guard. No lineup was changed." >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
        env:
          FANTA_BROWSER_TESTS: "true"

  update-squad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [schedule-guard, test]
    if: needs.schedule-guard.outputs.should_run == 'true'
    outputs:
      learning_artifact_id: ${{ steps.learning-state.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Update squad
        run: python auto_clicker_fanta.py
        env:
          FANTACALCIO_EMAIL: ${{ secrets.FANTACALCIO_EMAIL }}
          FANTACALCIO_PASSWORD: ${{ secrets.FANTACALCIO_PASSWORD }}
          LEAGUE_URL: ${{ secrets.LEAGUE_URL }}
          HEADLESS: "true"
          REPLACE_EXISTING_LINEUP: "true"
          DRY_RUN: ${{ inputs.dry_run || inputs.check_feedback_source || false }}
          CHECK_FEEDBACK_SOURCE: ${{ inputs.check_feedback_source || false }}
          FORMATION: ${{ vars.FORMATION || 'auto' }}

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squad-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squad-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload persistent learning state
        id: learning-state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/learning_state.json
          if-no-files-found: ignore
          retention-days: 1

  persist-learning-state:
    runs-on: ubuntu-latest
    needs: update-squad
    if: needs.update-squad.result == 'success' && inputs.check_feedback_source != true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download learning state
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.update-squad.outputs.learning_artifact_id }}
          merge-multiple: true
          path: _learning_state

      - name: Persist learning and decision history
        run: |
          cp _learning_state/learning_state.json data/learning_state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/learning_state.json
          if git diff --cached --quiet; then
            echo "Learning state did not change."
            exit 0
          fi
          git commit -m "chore: persist squad learning state"
          git push
